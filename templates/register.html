{% extends 'base.html' %}
{% block title %}Registro{% endblock %}
{% block content %}
  <div class="card mx-auto" style="max-width: 400px;">
    <div class="card-body">
      <h4 class="card-title mb-3">Crear cuenta</h4>
      {% if msg %}<div class="alert alert-{{ msg_type }}">{{ msg }}</div>{% endif %}
      <form method="post">
        <div class="mb-3">
          <label class="form-label">Usuario</label>
          <input type="text" name="username" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Contraseña</label>
          <input type="password" name="password" class="form-control" required>
        </div>
        <button class="btn btn-success w-100">Registrarse</button>
      </form>
      <p class="mt-3 text-center"><a href="{{ url_for('login') }}">Volver al login</a></p>
    </div>
  </div>
{% endblock %}
