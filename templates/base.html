<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <title>{% block title %}VulnApp{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container-fluid">
        <a class="navbar-brand" href="/">VulnApp</a>
        <div class="collapse navbar-collapse">
          <ul class="navbar-nav ms-auto">
            {% if 'user_id' in session %}
              <li class="nav-item"><a class="nav-link" href="{{ url_for('users') }}">Usuarios</a></li>
              <li class="nav-item"><a class="nav-link" href="{{ url_for('dashboard') }}">Dashboard</a></li>
              {% if session.get("username") == "admin" %}
                <li class="nav-item"><a class="nav-link text-warning" href="{{ url_for('logs') }}">Logs</a></li>
              {% endif %}
              <li class="nav-item"><a class="nav-link" href="{{ url_for('logout') }}">Salir</a></li>
            {% else %}
              <li class="nav-item"><a class="nav-link" href="{{ url_for('login') }}">Login</a></li>
              <li class="nav-item"><a class="nav-link" href="{{ url_for('register') }}">Registro</a></li>
            {% endif %}
          </ul>
        </div>
      </div>
    </nav>

    <div class="container mt-4">
      {% block content %}{% endblock %}
    </div>
  </body>
</html>
